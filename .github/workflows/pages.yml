name: Deploy site

# The site is one static file, so there is nothing to build.
#
# This repository currently serves Pages from the legacy branch source
# (`main`, root), so the live site is whatever sits at the root of `main` and
# this workflow is not what publishes it. It is kept because it is the shape
# that works if the Pages source is ever switched to "GitHub Actions": the two
# jobs are split because a job declaring `environment: github-pages` cannot
# start until that environment exists, which only happens under that source.

on:
  push:
    branches: [claude/terramech-arcade-game-jvh63c]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch Pages on if it is not already
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
