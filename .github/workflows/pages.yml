name: Deploy site

# The site is one static file, so there is nothing to build. It is split into
# two jobs on purpose: a job that declares `environment: github-pages` cannot
# start until that environment exists, and the environment only exists once
# Pages is switched on. So the first job turns Pages on (and uploads the site),
# and only then does the deploy job — the one bound to the environment — run.

on:
  push:
    branches: [claude/terramech-arcade-game-jvh63c]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch Pages on if it is not already
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Point Pages at this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          echo "--- PUT /pages source -> ${{ github.ref_name }} ---"
          curl -sS -X PUT -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" "$api" \
               -d '{"source":{"branch":"${{ github.ref_name }}","path":"/"}}' || true
          echo "--- GET /pages ---"
          curl -sS -w '\nHTTP %{http_code}\n' -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" "$api" || true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
